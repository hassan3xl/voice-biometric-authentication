{% load static %}
<header id="app-header">
  <nav>
    <a href="{% url 'app:home' %}" class="brand">
      <div class="brand-icon">
        <i class="fa-solid fa-waveform-lines"></i>
      </div>
      <span>VoiceAuth</span>
    </a>

    <div class="nav-actions">
      {% if user.is_authenticated %}
      <div class="user-pill">
        <div class="user-avatar">{{ user.username|slice:":1" }}</div>
        <span class="user-name">{{ user.first_name|default:user.username }}</span>
      </div>
      <a href="{% url 'app:logout' %}" class="nav-logout" title="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
      {% else %}
      <a href="{% url 'app:login' %}" class="nav-link-btn">Sign In</a>
      <a href="{% url 'app:register' %}" class="nav-link-btn nav-link-primary">Register</a>
      {% endif %}
    </div>
  </nav>
</header>
