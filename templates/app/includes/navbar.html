{% load static %}
<header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-8 flex items-center justify-between gap-6">
    <!-- Left Navigation / Brand -->
    <div class="flex items-center gap-4">
      <a href="{% url 'app:home' %}" class="flex items-center gap-2 font-extrabold text-lg text-white hover:text-emerald-400 transition-colors" title="voice biometri">
        <svg class="w-6 h-6 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4" />
        </svg>
        <span>voice biometri</span>
      </a>
    </div>

    <!-- Right Navigation Actions -->
    <div class="flex items-center gap-3">
      {% if user.is_authenticated %}
      <!-- Notification Dropdown Wrapper -->
      <div class="relative">
        <button
          id="nav-bell-btn"
          type="button"
          aria-label="Notifications"
          title="Notifications"
          class="relative flex items-center justify-center w-9 h-9 rounded-full bg-slate-800 text-slate-200 border border-slate-700 hover:bg-slate-700 transition duration-150 cursor-pointer"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span
            id="nav-bell-badge"
            class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold min-w-[18px] h-[18px] rounded-full flex items-center justify-center border-2 border-slate-900 px-1 shadow-sm {% if unread_notifications_count == 0 %}hidden{% endif %}"
          >
            {% if unread_notifications_count > 99 %}99+{% else %}{{ unread_notifications_count }}{% endif %}
          </span>
        </button>

        <!-- Notification Modal Dropdown -->
        <div
          id="nav-notification-modal"
          class="hidden absolute top-12 right-0 w-80 sm:w-96 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 z-50 overflow-hidden"
        >
          <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50">
            <div class="font-bold text-sm text-slate-900 flex items-center gap-2">
              <svg class="w-4 h-4 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span>Notifications</span>
            </div>
            <button
              id="modal-mark-all-btn"
              type="button"
              class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors"
            >
              Mark all read
            </button>
          </div>

          <div id="nav-notification-modal-list" class="max-h-80 overflow-y-auto divide-y divide-slate-100">
            <div class="p-6 text-center text-slate-500 text-xs">Loading notifications...</div>
          </div>

          <div class="px-4 py-2.5 border-t border-slate-100 text-center bg-slate-50">
            <a href="{% url 'notifications:list' %}" class="text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors block">
              View All Notifications &rarr;
            </a>
          </div>
        </div>
      </div>

      <!-- User Menu Dropdown -->
      <div class="relative group">
        <button class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-sm font-medium transition cursor-pointer">
          {% if user.get_avatar_url %}
            <img src="{{ user.get_avatar_url }}" alt="Avatar" class="w-6 h-6 rounded-full object-cover border border-blue-400" />
          {% else %}
            <svg class="w-4 h-4 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          {% endif %}
          <span>{{ user.first_name|default:user.email }}</span>
          <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>

        <div class="hidden group-hover:block absolute right-0 top-full pt-1 w-48 z-50">
          <div class="bg-white border border-slate-200 rounded-xl shadow-xl py-1 text-slate-700 text-sm overflow-hidden">
            <a href="{% url 'notifications:list' %}" class="flex items-center gap-2 px-4 py-2.5 hover:bg-slate-50 text-slate-700 transition">
              <svg class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span>Notifications</span>
            </a>
            <a href="{% url 'app:profile_edit' %}" class="flex items-center gap-2 px-4 py-2.5 hover:bg-slate-50 text-slate-700 transition">
              <svg class="w-4 h-4 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>View Profile</span>
            </a>
            {% if user.role == 'doctor' %}
            <a href="{% url 'app:doctor_working_hours' %}" class="flex items-center gap-2 px-4 py-2.5 hover:bg-slate-50 text-slate-700 transition">
              <svg class="w-4 h-4 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>Working Hours</span>
            </a>
            {% endif %}
            <div class="border-t border-slate-100 my-1"></div>
            <a href="{% url 'app:logout' %}" class="flex items-center gap-2 px-4 py-2.5 hover:bg-red-50 text-red-600 font-medium transition">
              <svg class="w-4 h-4 text-red-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span>Logout</span>
            </a>
          </div>
        </div>
      </div>
      {% else %}
      <!-- Auth Actions for Guest Users -->
      <a href="{% url 'app:login' %}" class="text-sm font-medium text-slate-200 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700 hover:bg-slate-800 transition">
        Login
      </a>
      <a href="{% url 'app:patient_register' %}" class="text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg shadow-sm transition">
        Register
      </a>
      {% endif %}
    </div>
  </nav>
</header>
