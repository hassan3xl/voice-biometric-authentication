<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>{% block title %}Home{% endblock %} | VoiceAuth</title>
    <meta name="description" content="Voice Biometric Authentication System — Enroll, verify, and manage your voiceprint.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% include 'app/includes/navbar.html' %}

    <!-- Toast Container -->
    <div id="toast-container" style="position:fixed;top:70px;right:12px;left:12px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:400px;margin-left:auto;pointer-events:none;">
      {% if messages %}{% for message in messages %}
      <div class="toast-card" style="pointer-events:auto;border:1px solid {% if message.tags == 'success' %}rgba(16,185,129,0.4){% elif message.tags == 'error' or message.tags == 'danger' %}rgba(239,68,68,0.4){% elif message.tags == 'warning' %}rgba(245,158,11,0.4){% else %}rgba(59,130,246,0.4){% endif %};">
        <div style="flex:1;font-size:13px;line-height:1.5;">{{ message }}</div>
        <button type="button" onclick="this.parentElement.remove()" style="background:none;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:0;">&times;</button>
      </div>
      {% endfor %}{% endif %}
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('#toast-container .toast-card').forEach(function(t) {
          setTimeout(function() { t.style.opacity='0'; t.style.transform='translateY(-8px)'; setTimeout(function(){ t.remove(); }, 300); }, 4000);
        });
      });
    </script>

    <main class="page-wrap">
      {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}

    <script src="/static/js/voice_recorder.js"></script>
  </body>
</html>
